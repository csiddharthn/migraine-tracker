services:
  postgres:
    image: postgres:17-alpine
    container_name: migraine-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: migraine_tracker
      POSTGRES_USER: migraine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - migraine_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migraine -d migraine_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  migraine_postgres_data:
