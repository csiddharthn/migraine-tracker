[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migraine-tracker"
version = "0.1.0"
description = "Deutsche Streamlit-Anwendung zur Erfassung und Analyse von Kopfschmerzen"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "groq>=0.31,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires MIGRAINE_TEST_DATABASE_URL in the environment or local .env",
  "visual: Streamlit visual smoke test",
]

[tool.coverage.run]
source = ["backend"]
branch = true
