name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: migraine_tracker
          POSTGRES_USER: migraine
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migraine -d migraine_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MIGRAINE_DATABASE_URL: postgresql+psycopg://migraine:ci_test_password@127.0.0.1:5432/migraine_tracker
      MIGRAINE_TEST_DATABASE_URL: postgresql+psycopg://migraine:ci_test_password@127.0.0.1:5432/migraine_tracker
      MIGRAINE_LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate database migrations
        run: python -m alembic upgrade head

      - name: Run all tests
        run: python -m pytest --junitxml=test-results/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
